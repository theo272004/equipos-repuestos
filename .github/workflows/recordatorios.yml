name: Recordatorios Telegram

# Cada ~5 minutos: manda los recordatorios de tareas, el parte del turno
# (8:40 y 20:40), el aviso de reporte faltante, el resumen de los lunes y el
# anuncio de los reportes del formulario; después atiende los comandos y
# botones que la gente usó en el grupo.
on:
  schedule:
    - cron: "*/5 * * * *"    # hora UTC; GitHub puede retrasarlo unos minutos
  workflow_dispatch: {}        # permite ejecutarlo a mano desde la pestaña Actions

# Evita ejecuciones solapadas
concurrency:
  group: recordatorios
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  FIREBASE_PROJECT_ID: mantenimiento-f405b
  # La API key web es pública (ya está en el sitio), no es un secreto.
  FIREBASE_API_KEY: AIzaSyBQzRHnGBX9TtxrOBoh5KX5dm6agguoSaQ
  # Solo si se activa la "clave del taller" (docs/FIREBASE.md → modo protegido)
  FIREBASE_EMAIL: ${{ secrets.FIREBASE_EMAIL }}
  FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
  APP_URL: https://theo272004.github.io/equipos-repuestos/

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Recordatorios, partes y avisos
        run: node scripts/send-reminders.mjs

      # Va después de enviar para que los botones del aviso recién mandado se
      # puedan usar ya.
      - name: Atender botones y comandos
        run: node scripts/bot-updates.mjs
